# .github/workflows/publish.yml
name: Publish

on:
  push:
    branches:
      - 'release/**'

jobs:
  publish:
    name: Release build and publish
    runs-on: macOS-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      # 秘密鍵（PRIVATE KEY BLOCK）を gpg にインポート
      - name: Import secret key to gpg
        shell: bash
        run: |
          printf '%s\n' "${{ secrets.GPG_KEY_CONTENTS }}" > /tmp/private.asc
          gpg --batch --import /tmp/private.asc
          rm -f /tmp/private.asc
          # ここで鍵が見えていればフォーマットはOK（ログは自動マスク）
          gpg --list-secret-keys --keyid-format LONG

      # gnupg モードで Publish（モジュールを明示）
      - name: Publish to Maven Central (gnupg mode)
        run: ./gradlew :kmp-onboarding:publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signing.gnupg.executable: gpg
          ORG_GRADLE_PROJECT_signing.gnupg.keyName: ${{ secrets.SIGNING_KEY_ID }}   # 16桁 LONG KeyID（省略可）
          ORG_GRADLE_PROJECT_signing.gnupg.passphrase: ${{ secrets.SIGNING_PASSWORD }}
