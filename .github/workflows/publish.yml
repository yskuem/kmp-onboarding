# .github/workflows/publish.yml
name: Publish

on:
  push:
    branches:
      - 'release/**'

jobs:
  publish:
    name: Release build and publish
    runs-on: macOS-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      # base64 -> PRIVATE KEY に戻して in-memory で渡す
      - name: Prepare signing props (base64 -> env)
        shell: bash
        run: |
          echo "${{ secrets.GPG_KEY_CONTENTS_B64 }}" | base64 --decode > /tmp/private.asc
          {
            echo 'ORG_GRADLE_PROJECT_signingInMemoryKey<<EOF'
            cat /tmp/private.asc
            echo 'EOF'
          } >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_signingInMemoryKeyPassword=${{ secrets.SIGNING_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_signingInMemoryKeyId=${{ secrets.SIGNING_KEY_ID }}" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_mavenCentralUsername=${{ secrets.MAVEN_CENTRAL_USERNAME }}" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_mavenCentralPassword=${{ secrets.MAVEN_CENTRAL_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Publish to Maven Central
        run: ./gradlew :kmp-onboarding:publishToMavenCentral --no-configuration-cache
